{% extends 'base.html' %}

{% block title %}
Edit Skill
{% endblock %}

{% block content %}

<div class="card">

    <h1>Edit Skill ✏️</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Update Skill
        </button>

    </form>

    <br>

    <a href="{% url 'my_skills' %}">
        Back to My Skills
    </a>

</div>

{% endblock %}
