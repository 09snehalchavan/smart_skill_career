{% extends 'base.html' %}
{% load static %}

{% block title %}
Edit Skill - Smart Career
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/edit_skill.css' %}">
{% endblock %}

{% block content %}

<div class="edit-skill-container">

    <div class="edit-skill-card">

        <!-- Header -->

        <div class="edit-skill-header">

            <div class="edit-skill-icon">
                ✏️
            </div>

            <div>

                <span class="edit-section-label">
                    SKILL MANAGEMENT
                </span>

                <h1>
                    Edit Skill
                </h1>

                <p>
                    Update your skill information and experience.
                </p>

            </div>

        </div>


        <!-- Form -->

        <form method="POST" class="edit-skill-form">

            {% csrf_token %}

            <div class="edit-form-fields">

                {{ form.as_p }}

            </div>


            <!-- Actions -->

            <div class="edit-form-actions">

                <a href="{% url 'my_skills' %}" class="edit-cancel-btn">
                    Cancel
                </a>

                <button type="submit" class="update-skill-btn">
                    💾 Update Skill
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
