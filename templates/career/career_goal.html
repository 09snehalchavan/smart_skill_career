{% extends 'base.html' %}

{% block title %}
Career Goal
{% endblock %}

{% block content %}

<div class="card">

    <h1>🎯 My Career Goal</h1>

    <p>
        Define your career goal and track your target.
    </p>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save Career Goal
        </button>

    </form>

    <br>

    <a href="{% url 'dashboard' %}">
        Back to Dashboard
    </a>

</div>

{% endblock %}
